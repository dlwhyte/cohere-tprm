<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TPRM Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 1.5rem 2rem;
    }

    header h1 { font-size: 1.4rem; font-weight: 600; }
    header p { font-size: 0.85rem; color: #aaa; margin-top: 0.25rem; }

    main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    input[type="text"]:focus { border-color: #1a1a2e; }

    button {
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover { background: #16213e; }
    button:disabled { background: #888; cursor: not-allowed; }

    .status {
      padding: 1rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      font-size: 0.9rem;
      display: none;
    }

    .status.loading {
      display: block;
      background: #e8f0fe;
      color: #1a1a2e;
    }

    .status.error {
      display: block;
      background: #fdecea;
      color: #b71c1c;
    }

    .brief {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 1.5rem 2rem;
      line-height: 1.6;
      display: none;
    }

    .brief.visible { display: block; }

    .brief h2 {
      font-size: 1.1rem;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      color: #1a1a2e;
    }

    .brief h2:first-child { margin-top: 0; }

    .brief p { margin-bottom: 0.5rem; }

    .brief ul { margin: 0.5rem 0 0.5rem 1.5rem; }
    .brief li { margin-bottom: 0.25rem; }

    .brief strong { color: #1a1a2e; }
  </style>
</head>
<body>
  <header>
    <h1>TPRM Agent</h1>
    <p>Third-Party Risk Management — powered by Cohere</p>
  </header>

  <main>
    <form id="form" class="input-group">
      <input type="text" id="query" placeholder="e.g. Risk brief for Wagner Group" autofocus>
      <button type="submit" id="btn">Run</button>
    </form>

    <div id="status" class="status"></div>
    <div id="brief" class="brief"></div>
  </main>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("query");
    const btn = document.getElementById("btn");
    const status = document.getElementById("status");
    const brief = document.getElementById("brief");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = input.value.trim();
      if (!query) return;

      btn.disabled = true;
      brief.classList.remove("visible");
      status.className = "status loading";
      status.textContent = "Running agent... this may take a minute.";

      try {
        const resp = await fetch("/api/brief", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query }),
        });

        const data = await resp.json();

        if (data.error) {
          status.className = "status error";
          status.textContent = data.error;
        } else {
          status.className = "status";
          brief.innerHTML = markdownToHtml(data.brief);
          brief.classList.add("visible");
        }
      } catch (err) {
        status.className = "status error";
        status.textContent = "Request failed: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });

    function markdownToHtml(md) {
      if (!md) return "";
      return md
        .replace(/^## (.+)$/gm, "<h2>$1</h2>")
        .replace(/^# (.+)$/gm, "<h2>$1</h2>")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/^- (.+)$/gm, "<li>$1</li>")
        .replace(/(<li>.*<\/li>\n?)+/g, (m) => "<ul>" + m + "</ul>")
        .replace(/\n{2,}/g, "</p><p>")
        .replace(/^(?!<[hul])(.+)$/gm, "<p>$1</p>")
        .replace(/<p><\/p>/g, "");
    }
  </script>
</body>
</html>
